plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.zhtrader.kaarobarly'
version = '1.0.0'

android {
  namespace "expo.modules.kbfirebase"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // same version expo-notifications uses, so Gradle keeps one copy
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
}
