# Nginx site for the Kaarobarly API (and the client portal pages).
# 1. Replace api.example.com with your domain.
# 2. sudo cp deploy/nginx-kaarobarly.conf /etc/nginx/sites-available/kaarobarly
#    sudo ln -s /etc/nginx/sites-available/kaarobarly /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. HTTPS: sudo certbot --nginx -d api.example.com   (certbot adds the 443 block itself)

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Payment proof photos and expense attachments are sent as JSON (up to ~6 MB).
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:4100;   # Monetra uses 4000 on the same server
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
