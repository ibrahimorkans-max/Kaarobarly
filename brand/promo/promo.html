<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Tijar promo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --navy: #0f2a3b; --ink: #13303f; --sub: #4f6a72; --green: #12a07f; --mint: #2bd8b0; --soft: #dff5ee; --line: #cfe7e0; --gold: #ffc23d; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: var(--h, 1350px); overflow: hidden; }
  body { font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; color: var(--ink); position: relative; background: #f4fbf9; }
  body.ur { font-family: 'Noto Nastaliq Urdu', 'Plus Jakarta Sans', serif; }
  .num { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; direction: ltr; unicode-bidi: isolate; }

  /* ---------- light background ---------- */
  .bg { position: absolute; inset: 0; background:
      radial-gradient(720px 560px at 82% 46%, rgba(43,216,176,.30), transparent 62%),
      radial-gradient(560px 460px at 4% 4%, rgba(255,194,61,.16), transparent 60%),
      radial-gradient(700px 500px at 30% 100%, rgba(18,160,127,.14), transparent 65%),
      linear-gradient(165deg, #ffffff 0%, #f1faf7 50%, #e4f5ef 100%); }
  .ur .bg { background:
      radial-gradient(720px 560px at 18% 46%, rgba(43,216,176,.30), transparent 62%),
      radial-gradient(560px 460px at 96% 4%, rgba(255,194,61,.16), transparent 60%),
      radial-gradient(700px 500px at 70% 100%, rgba(18,160,127,.14), transparent 65%),
      linear-gradient(195deg, #ffffff 0%, #f1faf7 50%, #e4f5ef 100%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(15,42,59,.045) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(15,42,59,.045) 1.5px, transparent 1.5px); background-size: 54px 54px;

  .ring { position: absolute; border-radius: 50%; border: 2.5px dashed rgba(18,160,127,.22); }

  /* ---------- header ---------- */
  .top { position: absolute; inset-inline: 66px; top: 58px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; direction: ltr; }
  .brand svg.m { width: 62px; height: 62px; filter: drop-shadow(0 8px 16px rgba(18,160,127,.3)); }
  .brand svg.w { height: 32px; width: auto; }
  .new { display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 9px; border-radius: 99px; background: #fff; border: 2px solid var(--line); font-weight: 700; font-size: 18px; color: var(--ink); box-shadow: 0 6px 18px rgba(15,42,59,.07); }
  .ur .new { padding: 4px 9px 8px 18px; font-size: 19px; }
  .new b { padding: 4px 12px; border-radius: 99px; color: #3a2500; font-size: 15px; letter-spacing: .06em; background: linear-gradient(160deg, #ffe08a, var(--gold)); box-shadow: 0 3px 0 #d39a1d; }
  .ur .new b { letter-spacing: 0; font-size: 17px; padding: 0 14px 6px; }

  /* ---------- headline ---------- */
  .head { position: absolute; inset-inline-start: 66px; top: 168px; width: 950px; }
  h1 { font-family: 'Space Grotesk'; font-weight: 700; font-size: 88px; line-height: 1; letter-spacing: -3px; color: var(--navy); white-space: nowrap; }
  h1 .g { color: var(--green); }
  .ur h1 { font-family: 'Noto Nastaliq Urdu'; font-weight: 700; font-size: 58px; line-height: 1.7; letter-spacing: 0; }
  .lead { margin-top: 18px; font-size: 25px; font-weight: 600; color: var(--sub); max-width: 900px; }
  .ur .lead { margin-top: -4px; font-size: 23px; line-height: 1.9; }
  .ur .feats { top: 500px; }

  /* ---------- features ---------- */
  .feats { position: absolute; inset-inline-start: 66px; top: 470px; width: 510px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .f { background: #fff; border: 2px solid var(--line); border-radius: 22px; padding: 18px 16px 16px; box-shadow: 0 5px 0 #d6ebe4, 0 16px 28px rgba(15,42,59,.07); min-height: 170px; }
  .f i { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-style: normal; background: linear-gradient(140deg, #34d9b3, #0f8a6f); box-shadow: 0 5px 0 #0b6f59; margin-bottom: 12px; }
  .f i svg { width: 28px; height: 28px; }
  .f b { display: block; font-size: 21px; font-weight: 800; color: var(--navy); line-height: 1.2; }
  .f span { display: block; margin-top: 5px; font-size: 16px; font-weight: 600; color: var(--sub); line-height: 1.35; }
  .ur .f { padding: 14px 16px 10px; }
  .ur .f i { margin-bottom: 4px; }
  .ur .f b { font-size: 20px; font-weight: 700; line-height: 1.75; }
  .ur .f span { font-size: 15px; line-height: 1.85; margin-top: 0; }

  /* ---------- phone ---------- */
  .stage { position: absolute; inset-inline-end: 40px; top: 432px; width: 440px; height: 740px; perspective: 1500px; transform: scale(.92); transform-origin: top; }
  .ur .stage { top: 478px; }
  .glow { position: absolute; inset: 40px -40px 20px; border-radius: 50%; background: radial-gradient(closest-side, rgba(43,216,176,.45), transparent); filter: blur(24px); }
  .phone { position: absolute; left: 50px; top: 0; width: 330px; height: 680px; border-radius: 50px; background: #0f2a3b; padding: 11px; transform: rotateY(-20deg) rotateX(7deg) rotateZ(2deg);
      box-shadow: inset 0 0 0 2px #2c5161, 20px 28px 0 -6px #c7e3db, 26px 44px 50px rgba(15,42,59,.28); }
  .ur .phone { transform: rotateY(20deg) rotateX(7deg) rotateZ(-2deg); box-shadow: inset 0 0 0 2px #2c5161, -20px 28px 0 -6px #c7e3db, -26px 44px 50px rgba(15,42,59,.28); }
  .phone::after { content: ''; position: absolute; inset: 0; border-radius: 50px; background: linear-gradient(115deg, rgba(255,255,255,.22), transparent 30%); pointer-events: none; }
  .scr { position: relative; height: 100%; border-radius: 40px; overflow: hidden; background: linear-gradient(180deg, #f4faf8, #e4f1ee); color: #132430; padding: 46px 15px 14px; display: flex; flex-direction: column; gap: 10px; }
  .notch { position: absolute; top: 11px; left: 50%; width: 92px; height: 25px; margin-left: -46px; border-radius: 14px; background: #0f2a3b; }
  .appbar { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
  .appbar svg { width: 26px; height: 26px; }
  .bal { border-radius: 20px; padding: 14px 16px; color: #fff; background: linear-gradient(135deg, #0f2a3b, #0f6a5e 55%, #14a383); }
  .bal small { font-size: 11px; font-weight: 800; letter-spacing: .08em; opacity: .9; }
  .ur .bal small { letter-spacing: 0; font-size: 13px; }
  .bal b { display: block; font-size: 30px; margin: 2px 0 9px; }
  .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.25); }
  .bar i { display: block; width: 68%; height: 100%; border-radius: 4px; background: #86efac; }
  .ur .bar i { margin-inline-start: 0; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .tile { background: #fff; border-radius: 14px; padding: 10px 11px; box-shadow: 0 3px 8px rgba(15,42,59,.06); }
  .tile b { display: block; font-size: 16px; }
  .tile span { color: #6e7f88; font-size: 11px; font-weight: 600; }
  .ur .tile span { display: block; font-size: 12px; line-height: 1.7; }
  .chart { background: #fff; border-radius: 14px; padding: 12px; height: 132px; display: flex; align-items: flex-end; gap: 8px; }
  .chart i { flex: 1; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, #2bd8b0, #0f8a6f); }
  .row { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 12px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; }
  .ur .row { font-size: 13px; padding: 2px 12px 6px; }
  .row em { font-style: normal; font-weight: 800; color: #0f8a6f; }
  .tabs { margin-top: auto; height: 56px; border-radius: 20px; background: linear-gradient(90deg, #0f2a3b, #0f6a5e); display: flex; align-items: center; justify-content: space-around; padding: 0 14px; }
  .tabs i { width: 22px; height: 22px; border-radius: 7px; background: rgba(255,255,255,.35); }
  .tabs i.on { background: #86efac; }
  .tabs b { width: 46px; height: 46px; margin-top: -26px; border-radius: 50%; display: grid; place-items: center; color: #03140f; font-size: 28px; background: linear-gradient(135deg, #8ff0d6, #2bd8b0); border: 4px solid #e4f1ee; }

  /* ---------- floating cards ---------- */
  .chip { position: absolute; display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 12px; border-radius: 18px; background: #fff; border: 2px solid var(--line);
      box-shadow: 0 5px 0 #d6ebe4, 0 18px 30px rgba(15,42,59,.14); font-weight: 800; font-size: 18px; white-space: nowrap; color: var(--navy); }
  .ur .chip { padding: 6px 12px 8px 18px; font-size: 18px; font-weight: 700; }
  .chip i { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(140deg, #34d9b3, #0f8a6f); color: #fff; font-style: normal; flex: none; }
  .chip i svg { width: 22px; height: 22px; }
  .chip small { display: block; color: var(--sub); font-size: 14px; font-weight: 600; }
  .ur .chip small { font-size: 14px; margin-top: -6px; }
  .chip.gold i { background: linear-gradient(160deg, #ffd55e, #e9a21b); }

  /* ---------- bottom ---------- */
  .bottom { position: absolute; inset-inline: 66px; bottom: 58px; display: flex; align-items: center; gap: 30px; }
  .coin { position: relative; flex: none; width: 196px; height: 196px; border-radius: 50%; display: grid; place-items: center; text-align: center; color: #3a2500;
      background: radial-gradient(circle at 35% 30%, #fff6d6, #ffd96b 40%, var(--gold) 65%, #d6971b); box-shadow: 0 10px 0 #c58a14, 0 26px 40px rgba(233,162,27,.32), inset 0 -6px 0 rgba(0,0,0,.08);
      transform: rotate(-7deg); border: 6px solid #fff0c2; }
  .ur .coin { transform: rotate(7deg); }
  .coin b { display: block; font-size: 80px; line-height: .85; }
  .coin span { display: block; font-weight: 900; font-size: 17px; letter-spacing: .05em; margin-top: 4px; }
  .ur .coin span { letter-spacing: 0; font-size: 20px; font-weight: 700; line-height: 1.55; margin-top: 4px; }
  .cta { flex: 1; }
  .cta .t { font-size: 29px; font-weight: 800; line-height: 1.2; color: var(--navy); }
  .cta .t em { font-style: normal; color: var(--green); }
  .ur .cta .t { font-size: 28px; font-weight: 700; line-height: 1.8; }
  .pills { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
  .ur .pills { margin-top: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 99px; background: #fff; border: 2px solid var(--line); font-weight: 700; font-size: 15.5px; color: var(--navy); }
  .ur .pill { padding: 1px 13px 7px; font-size: 15.5px; }
  .pill svg { width: 20px; height: 20px; color: var(--green); flex: none; }
  .ur .pill svg { margin-top: 6px; }
  .pill.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .pill.on svg { color: var(--mint); }

  /* ---------- story (1080 x 1920) ---------- */
  body.story .head { top: 200px; }
  body.story .stage { inset-inline-end: auto; inset-inline-start: 320px; top: 520px; transform: none; }
  body.story.ur .stage { top: 560px; }
  body.story.ur .feats { top: 1290px; }
  body.story .feats { top: 1250px; width: 948px; grid-template-columns: 1fr 1fr 1fr; }
  body.story .f { min-height: 168px; }
  body.story .bottom { bottom: 70px; }

  /* ---------- square (1080 x 1080) ---------- */
  body.square .head { top: 150px; width: 600px; }
  body.square h1 { font-size: 64px; letter-spacing: -2px; white-space: normal; }
  body.square .lead { font-size: 21px; max-width: 560px; }
  body.square.ur h1 { font-size: 48px; }
  body.square.ur .lead { font-size: 20px; }
  body.square .stage { inset-inline-end: 10px; top: 150px; transform: scale(.82); transform-origin: top; }
  body.square .feats { top: 500px; width: 560px; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  body.square .f { min-height: 0; padding: 12px; text-align: center; }
  body.square .f i { margin: 0 auto 8px; width: 46px; height: 46px; }
  body.square .f b { font-size: 16px; }
  body.square .f span { display: none; }
  body.square.ur .f b { font-size: 16px; }
  body.square .bottom { bottom: 50px; }
  body.square .coin { width: 170px; height: 170px; }
  body.square .coin b { font-size: 66px; }
  body.square .cta .t { font-size: 26px; }
  body.square.ur .cta .t { font-size: 24px; }
  body.square .chip.c3 { display: none; }
</style>
</head>
<body>

    wallet: I('<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/><path d="M6 6l9-3 1 3"/>'),

    chart: I('<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/>'),
    check: I('<path d="M5 12l5 5 9-10"/>'),
    print: I('<path d="M6 9V2h12v7"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v8H6z"/>'),
    offline: I('<path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 10 4 4 0 0 1 18 18z"/><path d="M9 14l2 2 4-4"/>'),
    android: I('<path d="M5 10h14v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M5 10a7 7 0 0 1 14 0M8 4l1.5 2.5M16 4l-1.5 2.5"/>'),
    windows: I('<path d="M3 5.5l7.5-1v7H3zM13 4.2L21 3v8.5h-8zM3 13h7.5v7l-7.5-1zM13 13h8v8l-8-1.2z"/>'),
    globe: I('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/>'),
    lang: I('<path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 5.5 5 7M11 5c-.5 3-3 6-6.5 7.5"/><path d="M13 21l4-9 4 9M14.5 18h5"/>'),
  };

  const $ = (id) => document.getElementById(id);
  $('brand').innerHTML = mark() + word;
  $('new').innerHTML = T.new;
  $('h1').innerHTML = T.h1;
  $('lead').textContent = T.lead;
  $('feats').innerHTML = T.feats.map(([i, b, s]) => `<div class="f"><i>${IC[i]}</i><b>${b}</b><span>${s}</span></div>`).join('');
  $('appbar').innerHTML = mark() + T.biz;
  $('balLabel').textContent = T.bal;
  $('t1').textContent = T.t1;
  $('t2').textContent = T.t2;
  $('r_1').textContent = T.r1; $('r_1v').textContent = T.r1v; $('r_2').textContent = T.r2; $('r_3').textContent = T.r3;
  const chip = (icon, [a, b]) => `<i>${IC[icon]}</i><div>${a}<small>${b.replace(/(Rs [\d,]+)/g, '<span class="num">$1</span>')}</small></div>`;
  $('c1').innerHTML = chip('check', T.c1);
  $('c2').innerHTML = chip('chart', T.c2);
  $('c3').innerHTML = chip('print', T.c3);
  $('days').textContent = days;
  $('coinText').innerHTML = T.coin;
  $('cta').innerHTML = T.cta;
  $('pills').innerHTML = T.pills.map(([i, t], k) => `<span class="pill${k === 0 ? ' on' : ''}">${IC[i]}${t}</span>`).join('');

  // floating cards and rings per size; inline-start/end mirror automatically in Urdu
  const place = (el, s) => Object.assign(el.style, s);
  const pos = {
    feed: { c1: { insetInlineStart: '-60px', top: '-18px' }, c2: { insetInlineEnd: '-40px', top: '300px' }, c3: { insetInlineStart: '20px', top: '540px' }, r1: [560, 430, 520], r2: [480, 350, 680] },
    story: { c1: { insetInlineStart: '-150px', top: '40px' }, c2: { insetInlineEnd: '-170px', top: '290px' }, c3: { insetInlineStart: '-170px', top: '520px' }, r1: [280, 560, 560], r2: [200, 480, 720] },
    square: { c1: { insetInlineStart: '-50px', top: '-10px' }, c2: { insetInlineEnd: '-20px', top: '300px' }, c3: {}, r1: [600, 160, 480], r2: [540, 100, 600] },
  }[size];
  place($('c1'), pos.c1); place($('c2'), pos.c2); place($('c3'), pos.c3);
  for (const k of ['r1', 'r2']) { const [x, y, d] = pos[k]; place($(k), { insetInlineStart: x + 'px', top: y + 'px', width: d + 'px', height: d + 'px' }); }
  document.fonts.ready.then(() => setTimeout(() => (document.body.dataset.ready = '1'), 300));
</script>
